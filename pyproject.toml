[project]
name = "ai-resume-reviewer"
version = "0.1.0"
description = "AI-powered resume reviewer"
readme = "README.md"
authors = [
    { name = "sivanisankar", email = "sivanisankar123@gmail.com" }
]
requires-python = ">=3.12"

dependencies = [
    "numpy>=2.5.1",
    "openai>=2.53.0",
    "pydantic>=2.13.4",
    "pypdf>=6.15.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "reportlab>=5.0.1",
    "streamlit>=1.61.1",
]
    
[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"  
[tool.uv.build-backend]
module-root = ""
